<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hozaifa | Smart AI Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My AI Task Manager</h1>
            <p>Mohd Hozaifa | IIMT B.Tech CS-AI</p>
        </header>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Write your next goal...">
            <button class="add-btn" onclick="addTask()"><i class="fas fa-plus"></i></button>
        </div>

        <button class="clear-all-btn" onclick="clearAllTasks()">
            <i class="fas fa-broom"></i> Clear All Tasks
        </button>

        <div id="taskList"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
